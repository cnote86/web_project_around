<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mario Campos">
    <meta name="keywords" content="Around">
    <link rel="stylesheet" href="./page/index.css">
    <title>Around the USA</title>
  </head>
  <body>
    <div class="page">
      <!-- Edit Profile Popup -->
      <div class="popup popup_form-edit-profile">
        <div class="popup__container">
          <dialog class="dialog">
            <h2 class="popup__title">Edit Profile</h2>
            <form class="popup__form form" novalidate>
              <input type="text" class="input input_popup-name popup__input" id="input_popup-name" aria-label="Name" aria-describedby="name-error" placeholder="Name" name="name" required minlength="2" maxlength="40">
              <p class="form__error" id="name-error" aria-live="polite"></p>
              <input type="text" class="input input_popup-job popup__input" id="input_popup-job" aria-label="About me" aria-describedby="job-error" placeholder="About me" name="job" required minlength="2" maxlength="200">
              <p class="form__error" id="job-error" aria-live="polite"></p>
              <button type="submit" class="button button_popup-submit" disabled>
                Save
              </button>
            </form>
            <button class="button button_close" id="close" type="button" aria-label="Close profile editor"> </button>
          </dialog>
        </div>
      </div>
      <!-- Add Gallery Popup -->
      <div class="popup popup_form-edit-gallery">
        <div class="popup__container">
          <dialog class="dialog dialog_gallery">
            <h2 class="popup__title">New Place</h2>
            <form class="popup__form popup__form_gallery form" novalidate>
              <input required minlength="2" maxlength="30" type="text" class="input input_popup-title popup__input" id="input_popup-title" aria-label="Title" aria-describedby="title-error" placeholder="Title" name="name">
              <p class="form__error" id="title-error" aria-live="polite"></p>
              <input required type="url" class="input input_popup-link popup__input" id="input_popup-link" aria-label="Image URL" aria-describedby="link-error" placeholder="Image URL" name="link">
              <p class="form__error" id="link-error" aria-live="polite"></p>
              <button type="submit" class="button button_popup-submit" disabled>
                Create
              </button>
            </form>
            <button class="button button_close" id="closeGallery" type="button" aria-label="Close new place form"> </button>
          </dialog>
        </div>
      </div>
      <!-- Card Template -->
      <template id="card-template">
        <div class="card">
          <img class="card__img" alt="National park">
          <div class="card__label">
            <p class="card__title"></p>
            <div class="card__actions">
              <button type="button" class="button card__delete-button" aria-label="Delete card"></button>
              <button type="button" class="button card__like-button" aria-label="Like card"></button>
            </div>
          </div>
        </div>
      </template>
      <!-- View Photo Popup -->
      <div class="popup popup_photo-gallery">
        <div class="popup__container">
          <dialog class="popup__gallery">
            <div class="popup__image-detail">
              <img id="popupImage" src="./images/Yosemite.jpg" class="popup__image" alt="enlarged image">
              <div id="popupText">Yosemite Valley</div>
            </div>
            <button class="button button_close" id="closeGallery2" type="button" aria-label="Close image preview"> </button>
          </dialog>
        </div>
      </div>
      <!-- Header -->
      <header class="header">
        <img src="./images/around_logo.svg" alt="Around" class="header__logo">
      </header>
      <!-- Main Content -->
      <main class="content">
        <section class="profile">
          <div class="profile__left">
            <img src="./images/profilepic.jpg" alt="Jacques Cousteau" class="profile__picture">
            <div>
              <h1 class="profile__name">
                <span id="profile__name">Jacques Cousteau</span>
                <button type="button" class="profile__button" id="profile__button">
                  <img src="./images/Profilebutton.png" alt="Edit profile">
                </button>
              </h1>
              <h2 id="profile__description" class="profile__description">Explorer</h2>
            </div>
          </div>
          <div class="gallery">
            <button type="button" class="profile__add" id="profile__card">
              <img src="./images/+.png" alt="Add a place">
            </button>
          </div>
        </section>
        <section class="elements" id="elements"></section>
      </main>
      <footer class="footer">
        <p>© 2026 Mario Campos</p>
      </footer>
      <!-- Scripts -->
      <script type="module" src="./page/index.js"></script>
    </div>
  </body>
</html>
